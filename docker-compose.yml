services:
  crm:
    build: .
    container_name: crm
    restart: unless-stopped
    ports:
      - "7070:8080"
    environment:
      ADMIN_USER: admin
      ADMIN_PASS: admin123          # troque a senha aqui
      SECRET_KEY: crm-local-secret
    volumes:
      - ./data:/data                # /data/hidromonitor:/data
