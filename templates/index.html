<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HidroMonitor · CRM</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logoHidromonitor.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='logoHidromonitor.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <div class="logo-container">
      <img class="logo-img" src="{{ url_for('static', filename='logoHidromonitor.png') }}" alt="HidroMonitor">
      <div class="logo-text">
        <span class="brand-hidro">Hidro</span><span class="brand-monitor">Monitor</span>
        <span class="brand-dot">•</span>
        <span class="brand-crm">CRM</span>
      </div>
    </div>
    <a href="{{ url_for('logout') }}">Sair</a>
  </header>

  <main class="wrap">
    <div class="acoes">
      <input class="busca" id="busca" placeholder="Buscar por nome, e-mail, número ou tag…">
      <button class="btn" id="novo">+ Adicionar contato</button>
      <button class="btn sec" id="btn-gerenciar-tags">Gerenciar Tags</button>
    </div>

    <div class="cartao">
      <table>
        <thead>
          <tr>
            <th>Contato</th>
            <th class="esconde-m">Número</th>
            <th>Tags</th>
            <th class="esconde-m">Observações</th>
            <th class="esconde-m">Adicionado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
      <div class="vazio" id="vazio" hidden>Nenhum contato encontrado.</div>
    </div>
  </main>

  <!-- Modal Contato -->
  <div class="fundo" id="fundo">
    <form class="modal" id="form">
      <h2 id="titulo">Adicionar contato</h2>
      <div class="grade">
        <div><label for="nome">Nome *</label><input id="nome" required></div>
        <div><label for="sobrenome">Sobrenome</label><input id="sobrenome"></div>
        <div><label for="email">E-mail</label><input id="email" type="email"></div>
        <div><label for="numero">Número</label><input id="numero" type="tel" inputmode="tel" maxlength="19" placeholder="(51) 99999-0000" autocomplete="off"></div>
        
        <div class="full">
          <label>Tags</label>
          <div class="checkbox-group" id="container-tags"></div>
        </div>

        <div class="full"><label for="observacoes">Observações</label><textarea id="observacoes"></textarea></div>
      </div>
      <div class="rodape">
        <button type="button" class="btn sec" id="cancelar">Cancelar</button>
        <button type="submit" class="btn azul">Salvar</button>
      </div>
    </form>
  </div>

  <!-- Modal Gerenciar Tags -->
  <div class="fundo" id="fundo-tags">
    <div class="modal">
      <h2>Gerenciar Tags</h2>
      <form id="form-criar-tag" class="nova-tag">
        <label for="nova-tag-nome">Nova tag</label>
        <div class="nova-tag-linha">
          <input id="nova-tag-nome" required maxlength="40" placeholder="Ex: Investidor, Black Friday">
          <button type="submit" class="btn azul">Criar</button>
        </div>
        <div class="swatches" id="cores-nova" role="radiogroup" aria-label="Cor da tag"></div>
      </form>

      <h3 class="sub">Tags existentes</h3>
      <div id="lista-tags" class="lista-tags"></div>
      <div class="rodape">
        <button type="button" class="btn sec" id="fechar-tags">Fechar</button>
      </div>
    </div>
  </div>

<script>
const PALETA = {{ paleta|tojson }};
let contatos = [];
let tags = [];
let editando = null;
let corNova = PALETA[0];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function api(url, opt = {}) {
  const r = await fetch(url, {
    headers: {"Content-Type": "application/json"}, ...opt
  });
  if (r.status === 401) { location.href = "/login"; return new Promise(() => {}); }  // sessão expirou
  return r.json();
}

async function carregar() {
  [contatos, tags] = await Promise.all([
    api("/api/contatos"),
    api("/api/tags")
  ]);
  desenhar();
  renderGerenciarTags();
}

/* Formata telefone enquanto digita: (51) 99999-0000, (51) 3333-4444 ou +55 (51) 99999-0000 */
function formatarNumero(v) {
  v = String(v || "");
  let d = v.replace(/\D/g, "");
  let prefixo = "";
  if (v.trim().startsWith("+")) {
    if (!d.startsWith("55")) return "+" + d.slice(0, 15);   // número de outro país: não mexe
    prefixo = "+55 "; d = d.slice(2);
  }
  d = d.slice(0, 11);
  if (!d) return prefixo.trim();
  const ddd = d.slice(0, 2), r = d.slice(2);
  let s;
  if (d.length <= 2) s = "(" + d;
  else if (d.length <= 6) s = `(${ddd}) ${r}`;
  else if (d.length <= 10) s = `(${ddd}) ${r.slice(0, 4)}-${r.slice(4)}`;
  else s = `(${ddd}) ${r.slice(0, 5)}-${r.slice(5)}`;
  return prefixo + s;
}

const nomesDe = (c) => (c.tags || "").split(",").map(t => t.trim()).filter(Boolean);
const corDe = (nome) => (tags.find(t => t.nome.toLowerCase() === nome.toLowerCase()) || {}).cor || "cinza";

function desenhar() {
  const q = $("busca").value.toLowerCase();

  // Filtragem exclusivamente via barra de pesquisa
  const lista = contatos.filter(c => {
    return !q || Object.values(c).join(" ").toLowerCase().includes(q);
  });

  $("vazio").hidden = lista.length > 0;
  $("corpo").innerHTML = lista.map(c => {
    const tagList = nomesDe(c).map(n =>
      `<span class="tag c-${corDe(n)}">${esc(n)}</span>`).join(" ");

    return `
      <tr>
        <td><strong>${esc(c.nome)} ${esc(c.sobrenome)}</strong><br><span class="mono">${esc(c.email)}</span></td>
        <td class="esconde-m">${esc(formatarNumero(c.numero))}</td>
        <td>${tagList || '<span class="mono">-</span>'}</td>
        <td class="esconde-m">${esc(c.observacoes)}</td>
        <td class="esconde-m mono">${esc(c.data_adicao)}</td>
        <td><div class="linha-acoes">
          <button class="btn sec" data-ed="${esc(c.id)}">Editar</button>
          <button class="btn perigo" data-del="${esc(c.id)}">Excluir</button>
        </div></td>
      </tr>`;
  }).join("");

  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => abrir(b.dataset.ed));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => excluir(b.dataset.del));
}

function renderCheckboxesTags(cTags = "") {
  const selected = cTags.split(",").map(t => t.trim().toLowerCase());
  $("container-tags").innerHTML = tags.length ? tags.map(t => `
    <label class="check-item c-${esc(t.cor)}">
      <input type="checkbox" name="tag-select" value="${esc(t.nome)}" ${selected.includes(t.nome.toLowerCase()) ? "checked" : ""}>
      ${esc(t.nome)}
    </label>
  `).join("") : `<span class="mono">Nenhuma tag criada. Use "Gerenciar Tags".</span>`;
}

/* ---- gerenciar tags: criar, trocar cor, excluir ---- */
function swatches(atual, attr) {
  return PALETA.map(c => `
    <button type="button" class="swatch c-${c} ${c === atual ? "on" : ""}" ${attr}="${c}"
            role="radio" aria-checked="${c === atual}" title="${c}"></button>`).join("");
}

function renderGerenciarTags() {
  $("cores-nova").innerHTML = swatches(corNova, "data-nova");
  $("cores-nova").querySelectorAll("[data-nova]").forEach(b => b.onclick = () => {
    corNova = b.dataset.nova;
    renderGerenciarTags();
  });

  $("lista-tags").innerHTML = tags.length ? tags.map(t => `
    <div class="tag-row">
      <div class="tag-info">
        <span class="tag c-${esc(t.cor)}">${esc(t.nome)}</span>
        <span class="mono">${t.contatos || 0} contato${t.contatos === 1 ? "" : "s"}</span>
      </div>
      <div class="swatches pequeno">${swatches(t.cor, `data-cor="${esc(t.id)}" data-v`)}</div>
      <button type="button" class="btn perigo" data-deltag="${esc(t.id)}">Excluir</button>
    </div>`).join("") : `<div class="vazio">Nenhuma tag ainda.</div>`;

  document.querySelectorAll("[data-cor]").forEach(b => b.onclick = async () => {
    await api("/api/tags/" + b.dataset.cor, {method: "PUT", body: JSON.stringify({cor: b.dataset.v})});
    carregar();
  });
  document.querySelectorAll("[data-deltag]").forEach(b => b.onclick = async () => {
    const t = tags.find(x => x.id === b.dataset.deltag);
    const n = t.contatos || 0;
    const aviso = n ? ` Ela será removida de ${n} contato${n === 1 ? "" : "s"}.` : "";
    if (!confirm(`Excluir a tag "${t.nome}"?${aviso}`)) return;
    await api("/api/tags/" + t.id, {method: "DELETE"});
    carregar();
  });
}

function abrir(id = null) {
  editando = id;
  const c = contatos.find(x => x.id === id) || {};
  $("titulo").textContent = id ? "Editar contato" : "Adicionar contato";
  for (const k of ["nome","sobrenome","email","numero","observacoes"]) $(k).value = c[k] || "";
  $("numero").value = formatarNumero(c.numero);
  renderCheckboxesTags(c.tags || "");
  $("fundo").classList.add("aberto");
  $("nome").focus();
}

const fechar = () => $("fundo").classList.remove("aberto");

async function excluir(id) {
  if (!confirm("Excluir este contato?")) return;
  await api("/api/contatos/" + id, {method: "DELETE"});
  carregar();
}

$("novo").onclick = () => abrir();
$("cancelar").onclick = fechar;
$("fundo").onclick = (e) => { if (e.target.id === "fundo") fechar(); };

$("btn-gerenciar-tags").onclick = () => $("fundo-tags").classList.add("aberto");
$("fechar-tags").onclick = () => $("fundo-tags").classList.remove("aberto");

$("busca").oninput = desenhar;

/* número formatado enquanto digita */
$("numero").addEventListener("input", (e) => { e.target.value = formatarNumero(e.target.value); });

/* limpa espaços ao sair do campo (o servidor também limpa) */
for (const k of ["nome", "sobrenome", "email"]) {
  $(k).addEventListener("blur", (e) => {
    const v = e.target.value.replace(/[​-‍⁠﻿]/g, "").replace(/\s+/g, k === "email" ? "" : " ").trim();
    e.target.value = k === "email" ? v.toLowerCase() : v;
  });
}

/* Teclado no formulário do contato: Enter pula para o próximo campo,
   Ctrl+Enter salva (inclusive de dentro das observações). */
$("form").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.ctrlKey || e.metaKey) { e.preventDefault(); $("form").requestSubmit(); return; }
  const el = e.target;
  if (el.tagName === "TEXTAREA" || el.tagName === "BUTTON") return;   // Enter normal
  e.preventDefault();
  const campos = [...$("form").querySelectorAll("input, textarea, button[type=submit]")];
  const prox = campos[campos.indexOf(el) + 1];
  if (prox) prox.focus();
});

/* Esc fecha qualquer janela aberta */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  document.querySelectorAll(".fundo.aberto").forEach(f => f.classList.remove("aberto"));
});

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const selecionadas = Array.from(document.querySelectorAll('input[name="tag-select"]:checked')).map(cb => cb.value);
  const corpo = { tags: selecionadas.join(",") };
  for (const k of ["nome","sobrenome","email","numero","observacoes"]) corpo[k] = $(k).value;

  const r = await api(editando ? "/api/contatos/" + editando : "/api/contatos",
    {method: editando ? "PUT" : "POST", body: JSON.stringify(corpo)});
  if (r && r.erro) { alert(r.erro); return; }
  fechar();
  carregar();
};

$("form-criar-tag").onsubmit = async (e) => {
  e.preventDefault();
  const nome = $("nova-tag-nome").value;
  const r = await api("/api/tags", {method: "POST", body: JSON.stringify({nome, cor: corNova})});
  if (r && r.erro) { alert(r.erro); return; }
  $("nova-tag-nome").value = "";
  corNova = PALETA[(tags.length + 1) % PALETA.length];  // sugere a próxima cor
  carregar();
};

carregar();
</script>
</body>
</html>
